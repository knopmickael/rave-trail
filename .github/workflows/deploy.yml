# CI/CD da Rave Trail.
# Dispara no push/merge para a branch develop:
#   1. valida (typecheck + testes)
#   2. builda a imagem Docker e publica no Amazon ECR
#   3. conecta por SSH no Lightsail e roda o deploy (pull + up + migrations)
#
# Secrets necessarios no repositorio (Settings > Secrets and variables > Actions):
#   AWS_ACCESS_KEY_ID      chave do usuario IAM com permissao de push no ECR
#   AWS_SECRET_ACCESS_KEY  segredo correspondente
#   AWS_REGION             ex.: us-east-2
#   ECR_REPOSITORY         ex.: rave-trail
#   LIGHTSAIL_HOST         IP estatico da instancia
#   LIGHTSAIL_USER         ex.: ubuntu
#   LIGHTSAIL_SSH_KEY      chave privada SSH (conteudo do .pem) com acesso a instancia

name: deploy

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  group: deploy-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-and-deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Troca o driver do Buildx para docker-container, que suporta o cache
      # type=gha usado no passo de build. O driver 'docker' padrao do runner nao
      # suporta export de cache.
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configurar credenciais AWS (chave do usuario IAM)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Montar a tag da imagem
        id: image
        run: |
          echo "uri=${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:develop-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy por SSH no Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ~/rave-trail/deploy
            ./scripts/deploy-release.sh "${{ steps.image.outputs.uri }}"
